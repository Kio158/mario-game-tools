<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1854c4">
  <meta name="description" content="马里奥星星争夺战的桌游工具箱。骰子、计分板、计时器与规则查询，正在准备中。">
  <title>桌游工具箱 · 马里奥星星争夺战</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="masthead"><span class="brand-star" aria-hidden="true">★</span><span>马里奥星星争夺战</span></header>
  <main>
    <section class="intro" aria-labelledby="title">
      <div>
        <h1 id="title">桌游工具箱</h1>
        <p class="lead">一起坐好，<br>准备开玩。</p>
        <p class="description">为围坐在桌边的大小玩家，准备一些顺手的小工具。</p>
      </div>
      <div class="dice" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </section>
    <section class="toolbox" aria-labelledby="tools-title">
      <div class="section-heading"><h2 id="tools-title">工具清单</h2><span>正在准备中</span></div>
      <ul>
        <li><span class="tool-symbol" aria-hidden="true">⚄</span><div><h3>骰子</h3><p>轻轻一点，决定下一步。</p></div><span class="status">待开发</span></li>
        <li><span class="tool-symbol" aria-hidden="true">★</span><div><h3>计分板</h3><p>每一颗星星，都记得清楚。</p></div><span class="status">待开发</span></li>
        <li><span class="tool-symbol" aria-hidden="true">◷</span><div><h3>计时器</h3><p>给挑战设一个倒计时。</p></div><span class="status">待开发</span></li>
        <li><span class="tool-symbol" aria-hidden="true">?</span><div><h3>规则查询</h3><p>想不起规则时，随手查一查。</p></div><span class="status">待开发</span></li>
      </ul>
    </section>
    <p class="note">这是工具箱的起始页，工具将陆续加入。</p>
  </main>
  <footer>留点时间，一起玩。</footer>
</body>
</html>
